name: Finalize v8
on:
  push:
    branches:
      - fix-v8-timeout-model-errors-values
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix-v8-timeout-model-errors-values
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: python scripts/finalize_v8.py
      - run: npm ci && npm run build
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finaliza v8 — timeout e filtro monetário"
          git push origin HEAD:fix-v8-timeout-model-errors-values
