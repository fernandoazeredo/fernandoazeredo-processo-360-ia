name: Preview Firebase Hosting

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  checks: write
  contents: read
  pull-requests: write

jobs:
  build-and-preview:
    if: ${{ github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Autenticar no Google Cloud para App Check
        id: google_auth
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PROCESSO_360_IA }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/cloud-platform

      - name: Criar token App Check exclusivo do Preview
        shell: bash
        env:
          ACCESS_TOKEN: ${{ steps.google_auth.outputs.access_token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          APP_RESOURCE="projects/685012306915/apps/1:685012306915:web:e9c441be57f15b41ee6ed6"
          API_BASE="https://firebaseappcheck.googleapis.com/v1"
          DISPLAY_NAME="preview-pr-${PR_NUMBER}"

          # Revoga tokens anteriores deste mesmo PR para manter somente um token de Preview válido.
          curl -fsS             -H "Authorization: Bearer ${ACCESS_TOKEN}"             "${API_BASE}/${APP_RESOURCE}/debugTokens?pageSize=100"             -o "$RUNNER_TEMP/appcheck-debug-list.json"

          jq -r --arg name "${DISPLAY_NAME}" '.debugTokens[]? | select(.displayName == $name) | .name'             "$RUNNER_TEMP/appcheck-debug-list.json" | while read -r token_name; do
              [ -z "$token_name" ] && continue
              curl -fsS -X DELETE                 -H "Authorization: Bearer ${ACCESS_TOKEN}"                 "${API_BASE}/${token_name}"
            done

          DEBUG_TOKEN="$(node -e "console.log(require('crypto').randomUUID())")"

          jq -n --arg displayName "${DISPLAY_NAME}" --arg token "${DEBUG_TOKEN}"             '{displayName:$displayName,token:$token}' > "$RUNNER_TEMP/appcheck-debug-create.json"

          curl -fsS -X POST             -H "Authorization: Bearer ${ACCESS_TOKEN}"             -H "Content-Type: application/json"             "${API_BASE}/${APP_RESOURCE}/debugTokens"             --data-binary @"$RUNNER_TEMP/appcheck-debug-create.json"             -o "$RUNNER_TEMP/appcheck-debug-created.json"

          jq -e --arg name "${DISPLAY_NAME}" '.displayName == $name'             "$RUNNER_TEMP/appcheck-debug-created.json" >/dev/null

          echo "APPCHECK_DEBUG_TOKEN=${DEBUG_TOKEN}" >> "$GITHUB_ENV"
          echo "::add-mask::${DEBUG_TOKEN}"

      - run: npm install

      - run: npm run build
        env:
          VITE_FIREBASE_API_KEY: "AIzaSyDj9w8tjTqYubxGc3oOEoXAvlX5J70aQPU"
          VITE_FIREBASE_AUTH_DOMAIN: "processo-360-ia.firebaseapp.com"
          VITE_FIREBASE_PROJECT_ID: "processo-360-ia"
          VITE_FIREBASE_STORAGE_BUCKET: "processo-360-ia.firebasestorage.app"
          VITE_FIREBASE_MESSAGING_SENDER_ID: "685012306915"
          VITE_FIREBASE_APP_ID: "1:685012306915:web:e9c441be57f15b41ee6ed6"
          VITE_APP_BUILD: ${{ github.event.pull_request.head.sha }}
          VITE_RELEASE_LABEL: "V9"
          VITE_APPCHECK_DEBUG_TOKEN: ${{ env.APPCHECK_DEBUG_TOKEN }}

      - name: Deploy Firestore rules para teste anônimo
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PROCESSO_360_IA }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "Segredo FIREBASE_SERVICE_ACCOUNT_PROCESSO_360_IA não configurado."
            exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-service-account.json"
          GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-service-account.json" \
            npx --yes firebase-tools@latest deploy \
              --project processo-360-ia \
              --only "firestore:rules" \
              --non-interactive

      - id: firebase_preview
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PROCESSO_360_IA }}
          projectId: processo-360-ia

      - name: Confirmar Preview V9 publicado
        shell: bash
        env:
          PREVIEW_URL: ${{ steps.firebase_preview.outputs.details_url }}
          BUILD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          echo "Preview: ${PREVIEW_URL}"
          echo "V9 build: ${BUILD_SHA:0:8}"

      - name: Remover credencial temporária
        if: always()
        run: rm -f "$RUNNER_TEMP/firebase-service-account.json"

  cleanup-preview-token:
    if: ${{ github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - name: Autenticar no Google Cloud
        id: google_auth
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PROCESSO_360_IA }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/cloud-platform

      - name: Revogar token App Check do Preview encerrado
        shell: bash
        env:
          ACCESS_TOKEN: ${{ steps.google_auth.outputs.access_token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          APP_RESOURCE="projects/685012306915/apps/1:685012306915:web:e9c441be57f15b41ee6ed6"
          API_BASE="https://firebaseappcheck.googleapis.com/v1"
          DISPLAY_NAME="preview-pr-${PR_NUMBER}"

          curl -fsS             -H "Authorization: Bearer ${ACCESS_TOKEN}"             "${API_BASE}/${APP_RESOURCE}/debugTokens?pageSize=100"             -o "$RUNNER_TEMP/appcheck-debug-list.json"

          jq -r --arg name "${DISPLAY_NAME}" '.debugTokens[]? | select(.displayName == $name) | .name'             "$RUNNER_TEMP/appcheck-debug-list.json" | while read -r token_name; do
              [ -z "$token_name" ] && continue
              curl -fsS -X DELETE                 -H "Authorization: Bearer ${ACCESS_TOKEN}"                 "${API_BASE}/${token_name}"
            done
