name: Preview Firebase Hosting

on: pull_request

permissions:
  checks: write
  contents: read
  pull-requests: write

jobs:
  build-and-preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
        env:
          VITE_FIREBASE_API_KEY: "AIzaSyDj9w8tjTqYubxGc3oOEoXAvlX5J70aQPU"
          VITE_FIREBASE_AUTH_DOMAIN: "processo-360-ia.firebaseapp.com"
          VITE_FIREBASE_PROJECT_ID: "processo-360-ia"
          VITE_FIREBASE_STORAGE_BUCKET: "processo-360-ia.firebasestorage.app"
          VITE_FIREBASE_MESSAGING_SENDER_ID: "685012306915"
          VITE_FIREBASE_APP_ID: "1:685012306915:web:e9c441be57f15b41ee6ed6"
          VITE_APP_BUILD: ${{ github.event.pull_request.head.sha }}
          VITE_RELEASE_LABEL: "V9"
      - name: Deploy Firestore rules para teste anônimo
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PROCESSO_360_IA }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "Segredo FIREBASE_SERVICE_ACCOUNT_PROCESSO_360_IA não configurado."
            exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-service-account.json"
          GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-service-account.json" \
            npx --yes firebase-tools@latest deploy \
              --project processo-360-ia \
              --only "firestore:rules" \
              --non-interactive

      - id: firebase_preview
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PROCESSO_360_IA }}
          projectId: processo-360-ia

      - name: Autorizar domínio do Preview no reCAPTCHA Enterprise
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PROCESSO_360_IA }}
          PREVIEW_URL: ${{ steps.firebase_preview.outputs.details_url }}
        run: |
          set -euo pipefail
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-service-account.json"

          python - <<'PY'
          import json, os, pathlib, subprocess, urllib.parse, urllib.request

          project = "processo-360-ia"
          key_id = "6Lc6ScstAAAAAIqfnEgXBICtkJtSbh6Wj7Cofwiz"
          preview_url = os.environ["PREVIEW_URL"]
          host = urllib.parse.urlparse(preview_url).hostname
          if not host:
              raise SystemExit(f"Não foi possível extrair o domínio do Preview: {preview_url}")

          cred_path = pathlib.Path(os.environ["RUNNER_TEMP"]) / "firebase-service-account.json"
          subprocess.run(
              ["gcloud", "auth", "activate-service-account", "--key-file", str(cred_path), "--quiet"],
              check=True
          )
          token = subprocess.check_output(["gcloud", "auth", "print-access-token"], text=True).strip()

          key_url = f"https://recaptchaenterprise.googleapis.com/v1/projects/{project}/keys/{key_id}"
          req = urllib.request.Request(key_url, headers={"Authorization": f"Bearer {token}"})
          with urllib.request.urlopen(req) as response:
              key = json.load(response)

          domains = list(key.get("webSettings", {}).get("allowedDomains", []))
          if host not in domains:
              domains.append(host)

          payload = json.dumps({
              "name": f"projects/{project}/keys/{key_id}",
              "webSettings": {"allowedDomains": domains}
          }).encode()

          patch_url = key_url + "?updateMask=webSettings.allowedDomains"
          patch = urllib.request.Request(
              patch_url,
              data=payload,
              method="PATCH",
              headers={
                  "Authorization": f"Bearer {token}",
                  "Content-Type": "application/json"
              }
          )
          with urllib.request.urlopen(patch) as response:
              json.load(response)

          print(f"Domínio autorizado no reCAPTCHA Enterprise: {host}")
          PY

      - name: Remover credencial temporária
        if: always()
        run: rm -f "$RUNNER_TEMP/firebase-service-account.json"
