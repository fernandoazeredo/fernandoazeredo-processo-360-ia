name: Preview Firebase Hosting

on: pull_request

permissions:
  checks: write
  contents: read
  pull-requests: write

jobs:
  build-and-preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
        env:
          VITE_FIREBASE_API_KEY: "AIzaSyDj9w8tjTqYubxGc3oOEoXAvlX5J70aQPU"
          VITE_FIREBASE_AUTH_DOMAIN: "processo-360-ia.firebaseapp.com"
          VITE_FIREBASE_PROJECT_ID: "processo-360-ia"
          VITE_FIREBASE_STORAGE_BUCKET: "processo-360-ia.firebasestorage.app"
          VITE_FIREBASE_MESSAGING_SENDER_ID: "685012306915"
          VITE_FIREBASE_APP_ID: "1:685012306915:web:e9c441be57f15b41ee6ed6"
          VITE_APP_BUILD: ${{ github.event.pull_request.head.sha }}
          VITE_RELEASE_LABEL: "V9"
      - name: Deploy Firestore rules para teste anônimo
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PROCESSO_360_IA }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "Segredo FIREBASE_SERVICE_ACCOUNT_PROCESSO_360_IA não configurado."
            exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-service-account.json"
          GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-service-account.json" \
            npx --yes firebase-tools@latest deploy \
              --project processo-360-ia \
              --only "firestore:rules" \
              --non-interactive

      - id: firebase_preview
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PROCESSO_360_IA }}
          projectId: processo-360-ia

      - name: Autorizar domínio do Preview no reCAPTCHA Enterprise
        id: google_auth
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PROCESSO_360_IA }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/cloud-platform

      - name: Incluir Preview nos domínios permitidos do App Check
        shell: bash
        env:
          ACCESS_TOKEN: ${{ steps.google_auth.outputs.access_token }}
          PREVIEW_URL: ${{ steps.firebase_preview.outputs.details_url }}
          RECAPTCHA_KEY: "6Lc6ScstAAAAAIqfnEgXBICtkJtSbh6Wj7Cofwiz"
        run: |
          set -euo pipefail

          PREVIEW_HOST="$(node -e "console.log(new URL(process.env.PREVIEW_URL).hostname)")"
          KEY_URL="https://recaptchaenterprise.googleapis.com/v1/projects/processo-360-ia/keys/${RECAPTCHA_KEY}"

          echo "Autorizando domínio temporário do Preview: ${PREVIEW_HOST}"

          curl -fsS             -H "Authorization: Bearer ${ACCESS_TOKEN}"             "${KEY_URL}"             -o "$RUNNER_TEMP/recaptcha-key.json"

          jq --arg host "${PREVIEW_HOST}" '
            .webSettings.allowedDomains = ((.webSettings.allowedDomains // []) + [$host] | unique)
            | {
                name: .name,
                displayName: .displayName,
                webSettings: .webSettings
              }
          ' "$RUNNER_TEMP/recaptcha-key.json" > "$RUNNER_TEMP/recaptcha-key-patch.json"

          curl -fsS -X PATCH             -H "Authorization: Bearer ${ACCESS_TOKEN}"             -H "Content-Type: application/json"             "${KEY_URL}?updateMask=webSettings.allowedDomains"             --data-binary @"$RUNNER_TEMP/recaptcha-key-patch.json"             -o "$RUNNER_TEMP/recaptcha-key-updated.json"

          jq -e --arg host "${PREVIEW_HOST}" '.webSettings.allowedDomains | index($host) != null'             "$RUNNER_TEMP/recaptcha-key-updated.json" >/dev/null

          echo "Domínio do Preview autorizado no reCAPTCHA Enterprise."

      - name: Remover credencial temporária
        if: always()
        run: rm -f "$RUNNER_TEMP/firebase-service-account.json"
