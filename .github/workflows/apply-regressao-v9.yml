name: Apply regression v9

on:
  push:
    branches:
      - fix-regressao-v9-contestacao

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix-regressao-v9-contestacao
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Apply v9 patch
        run: python scripts/apply_regressao_v9.py
      - name: Validate build
        run: npm ci && npm run build
      - name: Commit final changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Refina contestação trabalhista e cadastro profissional v9"
          git push origin HEAD:fix-regressao-v9-contestacao
