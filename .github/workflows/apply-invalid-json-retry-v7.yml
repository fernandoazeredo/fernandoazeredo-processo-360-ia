name: Apply invalid JSON retry v7

on:
  push:
    branches:
      - fix-gemini-invalid-json-retry-v7

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix-gemini-invalid-json-retry-v7
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Apply JSON retry patch
        run: python scripts/apply_invalid_json_retry_v7.py
      - name: Validate build
        run: npm ci && npm run build
      - name: Commit final changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Torna extração resiliente a JSON inválido do Gemini"
          git push origin HEAD:fix-gemini-invalid-json-retry-v7
