name: Apply regression v5

on:
  push:
    branches:
      - fix-regressao-v5-fidelidade-factual

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix-regressao-v5-fidelidade-factual
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Apply patch
        run: python scripts/apply_regressao_v5.py
      - name: Validate build
        run: |
          npm install
          npm run build
      - name: Commit final changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Corrige fidelidade factual e Motor B v5 [regressao-v5-aplicada]"
          git push origin HEAD:fix-regressao-v5-fidelidade-factual
