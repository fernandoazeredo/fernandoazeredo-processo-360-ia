name: Finalize regression v5
on:
  push:
    branches:
      - fix-regressao-v5-fidelidade-factual
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix-regressao-v5-fidelidade-factual
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: python scripts/finalize_regressao_v5.py
      - run: npm ci && npm run build
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finaliza Motor B v4 e fallbacks v5"
          git push origin HEAD:fix-regressao-v5-fidelidade-factual
