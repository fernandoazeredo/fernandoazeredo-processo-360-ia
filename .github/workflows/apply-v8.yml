name: Apply v8 robustness fixes

on:
  push:
    branches:
      - fix-v8-timeout-model-errors-values

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix-v8-timeout-model-errors-values
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Apply patch
        run: python scripts/apply_v8.py
      - name: Validate build
        run: npm ci && npm run build
      - name: Commit final changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "v8 — robustez Gemini, timeout e fidelidade de valores"
          git push origin HEAD:fix-v8-timeout-model-errors-values
