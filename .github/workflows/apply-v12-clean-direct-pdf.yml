name: Apply v12 clean direct PDF

on:
  push:
    branches:
      - fix-v12-pdf-peca-limpo-direto

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix-v12-pdf-peca-limpo-direto
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Apply v12 patch
        run: python scripts/apply_v12_clean_direct_pdf.py
      - name: Install
        run: npm ci
      - name: Validate build and capture diagnostics
        id: build
        shell: bash
        run: |
          set +e
          npm run build > v12-build.log 2>&1
          code=$?
          cat v12-build.log
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Commit build diagnostics on failure
        if: steps.build.outputs.code != '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f v12-build.log
          git commit -m "diagnostic: registra erro de build v12"
          git push origin HEAD:fix-v12-pdf-peca-limpo-direto
      - name: Commit changes
        if: steps.build.outputs.code == '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Corrige PDF da peça: limpo e download direto v12"
            git push origin HEAD:fix-v12-pdf-peca-limpo-direto
          fi
