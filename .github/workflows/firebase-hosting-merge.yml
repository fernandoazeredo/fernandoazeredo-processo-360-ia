name: Deploy Firebase Gratuito

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: firebase-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Instalar frontend
        run: npm install

      - name: Build frontend
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: "AIzaSyDj9w8tjTqYubxGc3oOEoXAvlX5J70aQPU"
          VITE_FIREBASE_AUTH_DOMAIN: "processo-360-ia.firebaseapp.com"
          VITE_FIREBASE_PROJECT_ID: "processo-360-ia"
          VITE_FIREBASE_STORAGE_BUCKET: "processo-360-ia.firebasestorage.app"
          VITE_FIREBASE_MESSAGING_SENDER_ID: "685012306915"
          VITE_FIREBASE_APP_ID: "1:685012306915:web:e9c441be57f15b41ee6ed6"

      - name: Preparar credencial Firebase
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PROCESSO_360_IA }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "Segredo FIREBASE_SERVICE_ACCOUNT_PROCESSO_360_IA não configurado."
            exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-service-account.json"

      - name: Deploy Hosting e regras do Firestore
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
          CI: "true"
        run: |
          npx --yes firebase-tools@latest deploy \
            --project processo-360-ia \
            --only "hosting,firestore:rules" \
            --non-interactive

      - name: Remover credencial temporária
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/firebase-service-account.json"
